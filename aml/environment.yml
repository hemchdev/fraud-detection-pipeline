# This is a recipe: it tells Azure exactly which Python packages to
# install inside the container that will run our training job. It's
# the cloud equivalent of requirements.txt — same packages, different
# format, because Azure ML environments are built from conda specs.
name: fraud-detection-env
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - pandas>=2.0
      - numpy>=1.24
      - scikit-learn>=1.3
      - joblib>=1.3
      - xgboost>=2.0
      - imbalanced-learn>=0.12
      - mlflow>=2.14
      - azureml-mlflow
