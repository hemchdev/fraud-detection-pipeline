# Describes ONE cloud training run: what code to run, what data to feed
# it, what environment (packages) to run it in, and what compute
# (virtual machine) to run it on.
#
# Submit it with:
#     az ml job create --file aml/job.yml
#
# `code: ..` means "upload the whole project folder" (one level up from
# this file) so that the `src` package is available inside the job.
$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
code: ..
command: >-
  python -m src.cloud.train_job_entry
  --data_path ${{inputs.fraud_data}}
  --model_output ${{outputs.model_dir}}
inputs:
  fraud_data:
    type: uri_file
    path: azureml:fraud-creditcard-data@latest
outputs:
  model_dir:
    type: uri_folder
    mode: rw_mount
environment: azureml:fraud-detection-env:1
compute: azureml:cpu-cluster
experiment_name: fraud-detection-cloud
display_name: fraud-xgboost-cloud-training
